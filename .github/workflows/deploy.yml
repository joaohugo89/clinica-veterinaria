# Publica a landing page no GitHub Pages a cada push na branch principal.
# Nada precisa ser configurado à mão além de: Settings → Pages → Source: GitHub Actions.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Liga o Pages no repositório (se ainda não estiver ligado) e expõe a base_path
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site fica em https://<usuario>.github.io/<repo>/, então a base do Vite
      # precisa ser /<repo>/. O nome vem do próprio repositório.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
